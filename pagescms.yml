# PagesCMS Content Schema Configuration
media_folder: "public/images"
public_folder: "/images"

collections:
  - name: "products"
    label: "Products"
    folder: "content/products"
    create: true
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Price", name: "price", widget: "number" }
      - { label: "Category Link", name: "category_link", widget: "string" }
      - { label: "Image", name: "image", widget: "image" }
      - { label: "Description", name: "description", widget: "text" }

  - name: "orders"
    label: "Customer Orders"
    folder: "content/orders"
    create: false
    fields:
      - { label: "Order ID", name: "orderId", widget: "string" }
      - { label: "Customer Address", name: "address", widget: "string" }
      - { label: "Delivery Date", name: "deliveryDate", widget: "string" }
